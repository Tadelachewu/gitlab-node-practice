name: CI/CD

# These jobs run on GitHub's servers, which can't reach your machine. Your machine
# deploys each published image itself, using scripts/watch-deploy.ps1.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must be lowercase, and must match the default in scripts/watch-deploy.ps1.
  IMAGE: ghcr.io/tadelachewu/gitlab-node-practice

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: >
          docker build
          -t "$IMAGE:${GITHUB_SHA::7}"
          -t "$IMAGE:main"
          --build-arg "BUILD_COMMIT=${GITHUB_SHA::7}"
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          .
      # Only the default branch publishes, so other branches never get deployed.
      - name: Publish image
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"

  # Off unless the CICD_SELF_HOSTED repository variable is "true". This runs on your machine,
  # which is the only place with both a GitHub OIDC token and access to Vault. It uses its own
  # container and port, so it doesn't replace what scripts/watch-deploy.ps1 deploys.
  deploy-vault:
    needs: build
    if: vars.CICD_SELF_HOSTED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      # Uses this machine's existing `docker login ghcr.io`.
      - run: docker pull -q "$($env:IMAGE):$($env:GITHUB_SHA.Substring(0,7))"
      - run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\deploy-vault.ps1
          -Image "$($env:IMAGE):$($env:GITHUB_SHA.Substring(0,7))"
          -Commit $env:GITHUB_SHA.Substring(0,7)
          -ContainerName contacts-app-vault
          -Port 3002
