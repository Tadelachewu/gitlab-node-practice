name: CI/CD

# These jobs run on GitHub's servers, which can't reach your machine. Your machine
# deploys each published image itself, using scripts/watch-deploy.ps1.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must be lowercase, and must match the default in scripts/watch-deploy.ps1.
  IMAGE: ghcr.io/tadelachewu/gitlab-node-practice

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: >
          docker build
          -t "$IMAGE:${GITHUB_SHA::7}"
          -t "$IMAGE:main"
          --build-arg "BUILD_COMMIT=${GITHUB_SHA::7}"
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          .
      # Only the default branch publishes, so other branches never get deployed.
      - name: Publish image
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
