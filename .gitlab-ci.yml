stages:
  - test
  - build
  - deploy

variables:
  NEXT_TELEMETRY_DISABLED: "1"

# Every job must carry this tag, because the runner does not accept untagged jobs.
default:
  tags:
    - local-windows

test:
  stage: test
  script:
    - node --version
    - npm ci
    - npm test

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Only deploys from the default branch. Other branches stop after build.
deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - .\scripts\deploy.ps1
