stages:
  - test
  - build
  - deploy

variables:
  NEXT_TELEMETRY_DISABLED: "1"

# Every job must carry this tag, because the runner does not accept untagged jobs.
default:
  tags:
    - local-windows

test:
  stage: test
  script:
    - node --version
    - npm ci
    - npm test

build:
  stage: build
  script:
    - .\scripts\build-image.ps1 -Commit $env:CI_COMMIT_SHORT_SHA

# Only deploys from the default branch. Other branches stop after build.
deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - .\scripts\deploy.ps1 -Commit $env:CI_COMMIT_SHORT_SHA -ContainerName contacts-app-gitlab -Port 3000
